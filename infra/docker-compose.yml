services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: code_learn_assist
      POSTGRES_USER: code_learn_assist
      POSTGRES_PASSWORD: code_learn_assist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://code_learn_assist:code_learn_assist@postgres:5432/code_learn_assist
      REDIS_URL: redis://redis:6379/0
      YANDEX_GPT_ENDPOINT: ${YANDEX_GPT_ENDPOINT:-}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:

